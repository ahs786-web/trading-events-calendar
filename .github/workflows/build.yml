name: build calendar

on:
  schedule:
    # 05:00 UTC daily. One run per day (the macro feed is rate limited).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# Needed so the job can commit the regenerated outputs back to the repo.
permissions:
  contents: write

concurrency:
  group: build-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build calendar
        # build.py exits non-zero if the macro fetch is denied or the earnings
        # source is broken. A failed run fails the workflow, which emails the
        # repo owner — that is the alerting mechanism.
        run: python build.py

      - name: Commit changed outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/events.ics
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: refresh calendar data [skip ci]"
            git push
          fi
