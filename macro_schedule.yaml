# Official-source macro release schedule — refresh ONCE A YEAR (~December).
#
# Why this file exists: the ForexFactory feed only covers the current week, so
# the ICS subscriber can't "plan the week ahead" around next month's FOMC/CPI.
# These dates come from the official publishers and are known far in advance:
#
#   FOMC : https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   CPI  : https://www.bls.gov/schedule/news_release/cpi.htm
#   NFP  : https://www.bls.gov/schedule/news_release/empsit.htm   (Employment Situation)
#   PPI  : https://www.bls.gov/schedule/news_release/ppi.htm
#   GDP / Core PCE : https://www.bea.gov/news/schedule            (Personal Income & Outlays)
#
# (BLS also publishes an auto-updating ICS at
#  https://www.bls.gov/schedule/news_release/bls.ics — handy when refreshing.)
#
# Times are US Eastern; build.py converts to Europe/London.
# `dedup`: if the ForexFactory feed already carries a matching event (title
# contains any keyword, same date), the schedule row is dropped in favour of the
# FF row, which has forecast/previous numbers.
#
# Seeded 2026-08-11 from the pages above. FOMC runs to Dec 2027; BLS/BEA
# schedules end at Dec 2026 — refresh when the 2027 schedules are published.

